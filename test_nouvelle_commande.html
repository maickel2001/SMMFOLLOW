<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Nouvelle Commande</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --accent: #f59e0b;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--light) 0%, var(--gray-light) 100%);
            min-height: 100vh;
            color: var(--dark);
            line-height: 1.6;
        }

        /* Navigation Apple-like avec transparence */
        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1rem 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
        }

        .navbar-brand span {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Bouton hamburger personnalisé avec transparence */
        .hamburger-btn {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            cursor: pointer;
            padding: 0;
            z-index: 1001;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .hamburger-line {
            width: 100%;
            height: 3px;
            background: var(--dark);
            border-radius: 2px;
            transition: all 0.3s ease;
            transform-origin: center;
        }

        .hamburger-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--primary);
        }

        .hamburger-btn:hover .hamburger-line {
            background: var(--primary);
        }

        /* Animation du hamburger */
        .hamburger-btn.active .hamburger-line:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }

        .hamburger-btn.active .hamburger-line:nth-child(2) {
            opacity: 0;
        }

        .hamburger-btn.active .hamburger-line:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        /* Menu de navigation avec transparence */
        .mobile-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(25px);
            border-radius: 0 0 16px 16px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: none;
            overflow: hidden;
            transform: translateY(-100%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
        }

        .mobile-menu.active {
            display: block;
            transform: translateY(0);
            opacity: 1;
        }

        .mobile-menu .navbar-nav {
            padding: 1rem;
        }

        .mobile-menu .nav-item {
            margin: 0.5rem 0;
        }

        .mobile-menu .nav-link {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--dark);
            text-decoration: none;
        }

        .mobile-menu .nav-link:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            transform: translateX(10px);
        }

        .mobile-menu .nav-link.active {
            background: var(--primary);
            color: white;
        }

        .navbar-nav {
            list-style: none;
        }

        .nav-item {
            margin: 0.5rem 0;
        }

        .nav-link {
            color: var(--dark);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-link:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }

        .nav-link.active {
            background: var(--primary);
            color: white;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .btn-logout {
            background: transparent;
            border: 2px solid var(--danger);
            color: var(--danger);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-logout:hover {
            background: var(--danger);
            color: white;
            transform: translateY(-2px);
        }

        /* Test content */
        .test-content {
            padding: 2rem;
            text-align: center;
        }

        .test-title {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .test-info {
            color: var(--gray);
            margin-bottom: 2rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .mobile-menu {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                height: 100vh;
                width: 100vw;
                background: rgba(255, 255, 255, 0.92);
                backdrop-filter: blur(25px);
                border-radius: 0;
                box-shadow: none;
                border: none;
                overflow-y: auto;
                transform: translateX(-100%);
                opacity: 0;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 9999;
            }

            .mobile-menu.active {
                transform: translateX(0);
                opacity: 1;
            }

            .mobile-menu .navbar-nav {
                padding: 2rem 1rem;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .mobile-menu .nav-item {
                margin: 1rem 0;
                text-align: center;
            }

            .mobile-menu .nav-link {
                padding: 1.5rem 2rem;
                font-size: 1.3rem;
                border-radius: 16px;
                margin: 0.5rem 0;
                justify-content: center;
            }

            .mobile-menu .nav-link:hover {
                transform: translateX(0) scale(1.05);
                box-shadow: var(--shadow-lg);
            }

            .close-menu-btn {
                position: absolute;
                top: 2rem;
                right: 2rem;
                width: 50px;
                height: 50px;
                background: rgba(255, 255, 255, 0.9);
                border: none;
                border-radius: 50%;
                font-size: 1.5rem;
                color: var(--dark);
                cursor: pointer;
                z-index: 10000;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: var(--shadow);
                transition: all 0.3s ease;
            }

            .close-menu-btn:hover {
                background: var(--danger);
                color: white;
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-rocket me-2"></i>Boost<span>Social</span>
            </a>
            
            <!-- Bouton hamburger personnalisé -->
            <button class="hamburger-btn" type="button" id="hamburgerBtn" aria-label="Toggle navigation">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            
            <!-- Menu de navigation -->
            <div class="mobile-menu" id="mobileMenu">
                <button class="close-menu-btn" id="closeMenuBtn" aria-label="Fermer le menu">
                    <i class="fas fa-times"></i>✕
                </button>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fas fa-list me-2"></i>Mes Commandes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            <i class="fas fa-plus me-2"></i>Nouvelle Commande
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fas fa-headset me-2"></i>Support
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="fas fa-user me-2"></i>Profil
                        </a>
                    </li>
                </ul>
            </div>
            
            <div class="user-menu">
                <div class="user-avatar">
                    T
                </div>
                <span class="d-none d-md-inline">Test User</span>
                <a href="#" class="btn-logout">
                    <i class="fas fa-sign-out-alt me-2"></i>Déconnexion
                </a>
            </div>
        </div>
    </nav>

    <!-- Test content -->
    <div class="test-content">
        <h1 class="test-title">Test Menu Hamburger</h1>
        <p class="test-info">Cliquez sur le bouton hamburger pour tester le menu mobile</p>
        <p>✅ Menu hamburger transparent implémenté</p>
        <p>✅ Navigation responsive</p>
        <p>✅ Design Apple-like</p>
    </div>

    <script>
        // Menu hamburger mobile
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const body = document.body;

        if (hamburgerBtn && mobileMenu) {
            // Ouvrir/fermer le menu
            hamburgerBtn.addEventListener('click', () => {
                hamburgerBtn.classList.toggle('active');
                mobileMenu.classList.toggle('active');
                body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
            });

            // Fermer avec le bouton X
            if (closeMenuBtn) {
                closeMenuBtn.addEventListener('click', () => {
                    hamburgerBtn.classList.remove('active');
                    mobileMenu.classList.remove('active');
                    body.style.overflow = '';
                });
            }

            // Fermer en cliquant sur un lien
            const mobileLinks = mobileMenu.querySelectorAll('.nav-link');
            mobileLinks.forEach(link => {
                link.addEventListener('click', () => {
                    hamburgerBtn.classList.remove('active');
                    mobileMenu.classList.remove('active');
                    body.style.overflow = '';
                });
            });

            // Fermer en cliquant à l'extérieur
            document.addEventListener('click', (e) => {
                if (!hamburgerBtn.contains(e.target) && !mobileMenu.contains(e.target)) {
                    hamburgerBtn.classList.remove('active');
                    mobileMenu.classList.remove('active');
                    body.style.overflow = '';
                }
            });

            // Fermer avec la touche Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && mobileMenu.classList.contains('active')) {
                    hamburgerBtn.classList.remove('active');
                    mobileMenu.classList.remove('active');
                    body.style.overflow = '';
                }
            });
        }
    </script>
</body>
</html>
